<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Guess the Password</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #FFE5D4; /* light peach */
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .container {
    text-align: center;
  }

  input[type="text"] {
    padding: 14px 18px;
    font-size: 18px;
    border: 2px solid #E8B49C;
    border-radius: 8px;
    outline: none;
    width: 260px;
    text-align: center;
    background-color: #FFFFFF;
    transition: border-color 0.2s ease;
  }

  input[type="text"]:focus {
    border-color: #D98A6B;
  }

  #message {
    margin-top: 20px;
    font-size: 20px;
    color: #2E7D32;
    font-weight: 600;
    display: none;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  #checkmark {
    display: inline-block;
    width: 26px;
    height: 26px;
  }

  #incorrect {
    margin-top: 20px;
    font-size: 16px;
    color: #B3261E;
    display: none;
  }
</style>
</head>
<body>

<div class="container">
  <input type="text" id="passwordInput" placeholder="Enter password" autofocus autocomplete="off">
  <div id="message">
    <svg id="checkmark" viewBox="0 0 52 52">
      <circle cx="26" cy="26" r="25" fill="none" stroke="#2E7D32" stroke-width="2"/>
      <path fill="none" stroke="#2E7D32" stroke-width="4" d="M14 27l7 7 17-17"/>
    </svg>
    <span>Congrats! You guessed the password right.</span>
  </div>
  <div id="incorrect">Incorrect password. Try again.</div>
</div>

<script>
  const input = document.getElementById("passwordInput");
  const message = document.getElementById("message");
  const incorrect = document.getElementById("incorrect");

  input.addEventListener("input", () => {
    // Clear any previous result as soon as the user types or clears the field
    message.style.display = "none";
    incorrect.style.display = "none";
  });

  input.addEventListener("keydown", async (e) => {
    if (e.key !== "Enter") return;

    const guess = input.value;
    if (guess.length === 0) return;

    try {
      const res = await fetch("/api/check-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ guess })
      });
      const data = await res.json();

      if (data.correct) {
        message.style.display = "flex";
        incorrect.style.display = "none";
        input.disabled = true;
      } else {
        message.style.display = "none";
        incorrect.style.display = "block";
      }
    } catch (err) {
      console.error("Request failed:", err);
    }
  });
</script>

</body>
</html>
